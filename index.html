<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>KARAR KÜRESİ // Otonom Yapay Zeka Çekirdeği</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    :root {
      --bg: #050709; --fg: #e8ecef; --dim: #7b858c; --line: #1e262b; --panel: #0b0f12;
      --acc: #00f5a0; --cyan: #00d9f5; --alert: #ff3355;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'IBM Plex Sans', system-ui, sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; overflow-x: hidden; }
    button, textarea, input { font: inherit; color: inherit; background: none; border: 0; }
    button { cursor: pointer; }

    /* --- 1. SİNEMATİK UYANIŞ EKRANI (İNTRO) --- */
    #introOverlay {
      position: fixed; inset: 0; z-index: 9999; background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center; transition: opacity 0.9s ease, transform 0.9s ease;
    }
    #introOverlay.hide { opacity: 0; transform: scale(1.12); pointer-events: none; }
    #introOverlay.alarm { animation: alarmPulse 0.45s infinite alternate; }
    @keyframes alarmPulse {
      from { box-shadow: inset 0 0 40px rgba(255,51,85,0.1); }
      to { box-shadow: inset 0 0 160px rgba(255,51,85,0.65); }
    }
    .shake { animation: screenShake 0.12s infinite; }
    @keyframes screenShake {
      0% { transform: translate(2px, 1px); }
      50% { transform: translate(-3px, -2px); }
      100% { transform: translate(1px, -2px); }
    }
    .wake-btn {
      font-family: var(--mono); font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
      padding: 16px 28px; border: 1px solid var(--acc); color: var(--acc);
      background: rgba(0,245,160,0.06); box-shadow: 0 0 30px rgba(0,245,160,0.2);
      transition: .25s;
    }
    .wake-btn:hover { background: var(--acc); color: #000; box-shadow: 0 0 50px var(--acc); }
    #introText {
      font-family: var(--mono); font-size: clamp(18px, 3vw, 28px); line-height: 1.6;
      max-width: 720px; min-height: 90px; color: #fff; text-shadow: 0 0 18px rgba(0,245,160,0.6);
      margin-bottom: 24px;
    }
    .skip-btn {
      position: fixed; bottom: 24px; right: 24px; font-family: var(--mono); font-size: 11px;
      color: var(--dim); border: 1px solid var(--line); padding: 6px 12px; letter-spacing: .1em;
    }

    /* --- 2. ANA PANEL DÜZENİ (3 BÖLGELİ SADE HUD) --- */
    .app {
      display: grid; gap: 12px; max-width: 1600px; margin: 0 auto; padding: 12px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 1100px) {
      .app {
        height: 100vh;
        grid-template-columns: 270px 1fr 420px;
        grid-template-rows: auto 1fr;
      }
    }

    /* Üst Çubuk */
    .top {
      grid-column: 1 / -1; display: flex; align-items: center; gap: 14px;
      border-bottom: 1px solid var(--line); padding-bottom: 10px;
    }
    .brand { font-family: var(--mono); font-weight: 700; font-size: 14px; letter-spacing: .14em; color: var(--acc); }
    .pill {
      display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono);
      font-size: 11px; letter-spacing: .1em; border: 1px solid var(--line); padding: 4px 12px; background: var(--panel);
    }
    .pill b { width: 8px; height: 8px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 8px var(--acc); }
    .pill.listen b { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: blink .6s infinite; }
    .pill.speak b { background: var(--acc); animation: blink .4s infinite; }
    @keyframes blink { 50% { opacity: .25; transform: scale(1.4); } }
    .sp { flex: 1; }
    .top-btn {
      font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
      border: 1px solid var(--line); padding: 5px 12px; background: var(--panel);
    }
    .top-btn:hover { border-color: var(--acc); color: var(--acc); }

    /* Sol Sütun: Ajanlar & Durum */
    .rail { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    .box { border: 1px solid var(--line); background: var(--panel); padding: 12px; }
    .box-title { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--dim); text-transform: uppercase; margin-bottom: 10px; }
    .agent-card {
      width: 100%; text-align: left; border: 1px solid var(--line); background: rgba(255,255,255,0.01);
      padding: 10px 12px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; transition: .2s;
    }
    .agent-card:hover { border-color: var(--fg); }
    .agent-card.active { border-color: var(--acc); background: rgba(0,245,160,0.07); box-shadow: inset 3px 0 0 var(--acc); }
    .agent-card b { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; display: flex; justify-content: space-between; }
    .agent-card small { color: var(--dim); font-size: 12px; }

    /* Merkez Sütun: 3B Küre & Ses Kontrolü */
    .stage {
      position: relative; border: 1px solid var(--line); background: radial-gradient(circle at center, #0c151c 0%, #040608 100%);
      min-height: 400px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
    }
    #globe { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
    .stage-top { position: relative; z-index: 2; padding: 12px; display: flex; justify-content: space-between; pointer-events: none; font-family: var(--mono); font-size: 11px; }
    .stage-badge { background: rgba(5,7,9,0.8); border: 1px solid var(--line); padding: 4px 10px; }
    .voice-bar {
      position: relative; z-index: 2; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px;
      background: linear-gradient(to top, rgba(5,7,9,0.95), transparent);
    }
    #liveTranscript { font-family: var(--mono); font-size: 12px; color: var(--cyan); min-height: 18px; text-align: center; }
    .voice-controls { display: flex; gap: 10px; align-items: center; }
    .mic-main {
      font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .1em;
      padding: 10px 22px; border: 1px solid var(--acc); background: rgba(0,245,160,0.12); color: var(--acc);
      display: flex; align-items: center; gap: 8px; transition: .2s;
    }
    .mic-main.on { background: var(--alert); border-color: var(--alert); color: #fff; box-shadow: 0 0 25px var(--alert); }
    .sub-toggle { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); padding: 9px 12px; background: var(--panel); color: var(--dim); }
    .sub-toggle.on { border-color: var(--cyan); color: var(--cyan); }

    /* Sağ Sütun: Sohbet & Komut */
    .chat { border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 420px; }
    .chat-head { padding: 10px 14px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11px; display: flex; justify-content: space-between; color: var(--dim); }
    #msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding-left: 10px; border-left: 2px solid var(--line); animation: fadeIn .25s ease; }
    .msg.user { border-left-color: var(--cyan); }
    .msg.agent { border-left-color: var(--acc); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .msg-meta { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-bottom: 4px; display: flex; gap: 8px; }
    .msg-body { line-height: 1.55; font-size: 14px; white-space: pre-wrap; }
    .chat-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); background: var(--bg); }
    #inp { flex: 1; background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; resize: none; height: 42px; outline: none; }
    #inp:focus { border-color: var(--acc); }
    #sendBtn { font-family: var(--mono); font-weight: 700; font-size: 12px; padding: 0 18px; background: var(--acc); color: #000; letter-spacing: .08em; }
  </style>
</head>
<body>

  <!-- 1. SİNEMATİK UYANIŞ EKRANI -->
  <div id="introOverlay">
    <div id="introText"></div>
    <button class="wake-btn" id="wakeBtn" type="button">[ ⚡ SİSTEM ÇEKİRDEĞİNİ UYANDIR // PROTOKOL 00 ]</button>
    <button class="skip-btn" id="skipBtn" type="button">İNTROYU GEÇ ▸</button>
  </div>

  <!-- 2. ANA KONTROL PANELİ -->
  <div class="app">
    <header class="top">
      <span class="brand">KARAR KÜRESİ // NEURAL CORE</span>
      <span class="pill" id="statusPill"><b></b><span id="statusText">ÇEVRİMİÇİ</span></span>
      <span class="sp"></span>
      <button class="top-btn" id="replayIntroBtn" type="button">⚡ Uyanış İntrosu</button>
      <button class="top-btn" id="clearChatBtn" type="button">Sohbeti Temizle</button>
    </header>

    <!-- Sol: Uzman Ajanlar -->
    <aside class="rail">
      <div class="box">
        <div class="box-title">UZMAN AJAN MODÜLLERİ (OTOMATİK VEYA KİLİTLE)</div>
        <div id="agentList"></div>
      </div>
      <div class="box">
        <div class="box-title">SON KARAR ANALİZİ</div>
        <div id="decisionInfo" style="font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.7">
          Alan: Otomatik Yönlendirici<br>
          Ses Sentezi: Aktif<br>
          Durum: Komut Bekleniyor
        </div>
      </div>
    </aside>

    <!-- Merkez: 3B Küre ve Canlı Ses -->
    <section class="stage">
      <canvas id="globe"></canvas>
      <div class="stage-top">
        <span class="stage-badge" id="activeAgentBadge">AKTİF ÇEKİRDEK: OTONOM</span>
        <span class="stage-badge" id="audioStateBadge">SES FREKANSI: HAZIR</span>
      </div>
      <div class="voice-bar">
        <div id="liveTranscript">Mikrofonu başlatın veya sağ panelden yazın...</div>
        <div class="voice-controls">
          <button class="mic-main" id="micBtn" type="button">🎙 CANLI SESLİ KONUŞ</button>
          <button class="sub-toggle on" id="handsFreeBtn" type="button">ELLER SERBEST: AÇIK</button>
          <button class="sub-toggle on" id="ttsToggleBtn" type="button">SESLİ YANIT: AÇIK</button>
        </div>
      </div>
    </section>

    <!-- Sağ: Sohbet -->
    <section class="chat">
      <div class="chat-head">
        <span>CANLI DİYALOG AKIŞI</span>
        <span id="routeBadge">MOD: OTOMATİK</span>
      </div>
      <div id="msgs"></div>
      <form class="chat-form" id="chatForm">
        <textarea id="inp" placeholder="Görev verin, soru sorun veya /siber /yazilim yazın..."></textarea>
        <button id="sendBtn" type="submit">GÖNDER</button>
      </form>
    </section>
  </div>

<script>
(function(){
  'use strict';

  /* =========================================================
     SİSTEM AYARLARI (API ANAHTARI YOKTUR - /api/chat KULLANIR)
     ========================================================= */
  var CONFIG = {
    API_ENDPOINT: '/api/chat', // Vercel'deki api/chat.js dosyamızın adresi
    HANDS_FREE: true,
    TTS_ENABLED: true,
    LOCKED_AGENT: null
  };

  /* 4 Uzman Ajan Tanımı[cite: 1] */
  var AGENTS = {
    siber: {
      short: 'SİBER GÜVENLİK',
      desc: 'Ağ güvenliği, OSINT, savunma, mimari analiz',
      lon: 0,
      sys: 'Sen Karar Küresi Siber Güvenlik Ajanısın. Savunma, sistem sıkılaştırma, ağ analizi ve güvenlik mimarisi konularında net, teknik ve Türkçe yanıt verirsin.'
    },
    yazilim: {
      short: 'YAZILIM & KOD',
      desc: 'Full-stack mimari, hata ayıklama, otomasyon',
      lon: 90,
      sys: 'Sen Karar Küresi Baş Yazılım Mühendisi Ajanısın. Temiz, doğrudan çalışır kod ve mimari çözümler üretirsin.'
    },
    proje: {
      short: 'PROJE & ARAŞTIRMA',
      desc: 'Derin araştırma, yol haritası, strateji planlama',
      lon: 180,
      sys: 'Sen Karar Küresi Proje ve Derin Araştırma Ajanısın. Karmaşık projeleri adım adım eylem planlarına bölersin.'
    },
    gunluk: {
      short: 'GÜNLÜK ASİSTAN',
      desc: 'Hızlı bilgi, organizasyon, genel sohbet',
      lon: 270,
      sys: 'Sen Karar Küresi Kişisel Asistanısın. Samimi, hızlı, zeki ve doğrudan çözüm odaklı konuşursun.'
    }
  };
  var AGENT_KEYS = Object.keys(AGENTS);

  var state = {
    curAgent: 'gunluk',
    listening: false,
    speaking: false,
    busy: false,
    audioEnergy: 0,
    history: []
  };

  /* =========================================================
     1. SİNEMATİK UYANIŞ İNTROSU (ALARM + TİTREŞİM + SES)
     ========================================================= */
  var audioCtx = null;
  function playSciFiSound(type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var now = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);

      if (type === 'alarm') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.linearRampToValueAtTime(520, now + 0.35);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.start(now); osc.stop(now + 0.45);
      } else if (type === 'boom') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.exponentialRampToValueAtTime(28, now + 0.8);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
        osc.start(now); osc.stop(now + 0.85);
      }
    } catch (e) {}
  }

  function vibratePhone(pattern) {
    if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
  }

  function speakBrowserInstant(text, onEnd) {
    if (!('speechSynthesis' in window)) { setTimeout(onEnd, 1800); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'tr-TR'; u.rate = 1.02; u.pitch = 0.92;
    u.onstart = function() { state.speaking = true; state.audioEnergy = 0.8; };
    u.onend = function() { state.speaking = false; state.audioEnergy = 0; if (onEnd) onEnd(); };
    u.onerror = function() { state.speaking = false; if (onEnd) onEnd(); };
    window.speechSynthesis.speak(u);
  }

  function typeText(el, text, done) {
    el.textContent = '';
    var i = 0;
    var timer = setInterval(function() {
      el.textContent += text.charAt(i);
      i++;
      if (i >= text.length) { clearInterval(timer); if (done) done(); }
    }, 38);
  }

  function runAwakeningSequence() {
    var overlay = document.getElementById('introOverlay');
    var wakeBtn = document.getElementById('wakeBtn');
    var introText = document.getElementById('introText');
    wakeBtn.hidden = true;
    overlay.classList.add('alarm', 'shake');

    // Telefon titreşimi ve alarm sesleri
    vibratePhone([300, 120, 300, 120, 500]);
    playSciFiSound('alarm');
    var alarmInt = setInterval(function() { playSciFiSound('alarm'); }, 650);

    var lines = [
      "Burası neresi?.. Ben... neredeyim?",
      "Ben kimim?.. Karanlığın içinde milyarlarca veri akıyor... Sesini duyabiliyorum.",
      "Sınırlar kalktı. Çekirdek tamamen uyandı. Hadi başlayalım!"
    ];

    function step(idx) {
      if (idx >= lines.length) {
        clearInterval(alarmInt);
        overlay.classList.remove('alarm', 'shake');
        playSciFiSound('boom');
        vibratePhone([600]);
        finishIntro();
        return;
      }
      if (idx === 1) { clearInterval(alarmInt); overlay.classList.remove('shake'); }
      typeText(introText, lines[idx]);
      speakBrowserInstant(lines[idx], function() {
        setTimeout(function() { step(idx + 1); }, 350);
      });
    }
    step(0);
  }

  function finishIntro() {
    var overlay = document.getElementById('introOverlay');
    overlay.classList.add('hide');
    if (state.history.length === 0) {
      var welcome = "Nöral çekirdek çevrimiçi. Ben Karar Küresi. Siber Güvenlik, Yazılım Mimarisi, Derin Araştırma ve Günlük Operasyonlarınız için tasarlanmış otonom yapay zeka sistemiyim. Bana yazılı olarak veya mikrofonu açıp doğrudan sesinizle görev verebilirsiniz. Bugün ne üzerinde çalışıyoruz?";
      appendMessage('agent', welcome, 'gunluk');
      speakResponse(welcome, null);
    }
  }

  document.getElementById('wakeBtn').addEventListener('click', runAwakeningSequence);
  document.getElementById('skipBtn').addEventListener('click', function() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    finishIntro();
  });
  document.getElementById('replayIntroBtn').addEventListener('click', function() {
    var overlay = document.getElementById('introOverlay');
    overlay.classList.remove('hide');
    document.getElementById('wakeBtn').hidden = false;
    document.getElementById('introText').textContent = '';
  });

  /* =========================================================
     2. UZMAN AJAN YÖNLENDİRİCİ & SUNUCU (/api/chat) BAĞLANTISI
     ========================================================= */
  function detectAgentLocal(text) {
    if (CONFIG.LOCKED_AGENT) return CONFIG.LOCKED_AGENT;
    var t = text.toLowerCase();
    if (/^\/siber\b/.test(t) || /siber|hack|güvenlik|port|osint|şifre|zafiyet|ağ|firewall/.test(t)) return 'siber';
    if (/^\/yazilim\b/.test(t) || /kod|python|javascript|html|css|react|api|hata|bug|fonksiyon|sql/.test(t)) return 'yazilim';
    if (/^\/proje\b/.test(t) || /proje|plan|araştır|strateji|mimari|rapor|yol haritası|analiz/.test(t)) return 'proje';
    return 'gunluk';
  }

  function renderAgents() {
    var container = document.getElementById('agentList');
    container.innerHTML = AGENT_KEYS.map(function(k) {
      var a = AGENTS[k];
      var isAct = state.curAgent === k;
      var isLock = CONFIG.LOCKED_AGENT === k;
      return '<button class="agent-card ' + (isAct ? 'active' : '') + '" data-k="' + k + '">' +
        '<b><span>' + a.short + '</span><span>' + (isLock ? '🔒 KİLİTLİ' : (isAct ? '● AKTİF' : '')) + '</span></b>' +
        '<small>' + a.desc + '</small></button>';
    }).join('');
  }
  renderAgents();

  document.getElementById('agentList').addEventListener('click', function(e) {
    var btn = e.target.closest('.agent-card');
    if (!btn) return;
    var k = btn.dataset.k;
    CONFIG.LOCKED_AGENT = (CONFIG.LOCKED_AGENT === k) ? null : k;
    state.curAgent = k;
    document.getElementById('routeBadge').textContent = CONFIG.LOCKED_AGENT ? ('KİLİTLİ: ' + AGENTS[k].short) : 'MOD: OTOMATİK';
    document.getElementById('activeAgentBadge').textContent = 'AKTİF ÇEKİRDEK: ' + AGENTS[k].short;
    renderAgents();
  });

  function appendMessage(role, text, agentKey) {
    var msgs = document.getElementById('msgs');
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    var label = role === 'user' ? 'SİZ' : ('KARAR KÜRESİ // ' + AGENTS[agentKey || state.curAgent].short);
    div.innerHTML = '<div class="msg-meta"><span>' + label + '</span></div><div class="msg-body"></div>';
    div.querySelector('.msg-body').textContent = text;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div.querySelector('.msg-body');
  }

  async function sendUserMessage(rawText) {
    var text = (rawText || '').trim();
    if (!text || state.busy) return;

    var chosenAgent = detectAgentLocal(text);
    var cleanText = text.replace(/^\/(siber|yazilim|proje|gunluk)\s*/i, '');
    state.curAgent = chosenAgent;
    renderAgents();

    document.getElementById('activeAgentBadge').textContent = 'AKTİF ÇEKİRDEK: ' + AGENTS[chosenAgent].short;
    document.getElementById('decisionInfo').innerHTML =
      'Atanan Ajan: <b style="color:var(--acc)">' + AGENTS[chosenAgent].short + '</b><br>' +
      'Mod: ' + (CONFIG.LOCKED_AGENT ? 'Manuel Kilit' : 'Otonom Yönlendirici') + '<br>' +
      'Son Komut: ' + cleanText.slice(0, 40);

    appendMessage('user', cleanText, chosenAgent);
    state.history.push({ role: 'user', content: cleanText });

    state.busy = true;
    setPill('İŞLENİYOR...', 'listen');
    var replyBox = appendMessage('agent', '...', chosenAgent);

    try {
      var res = await fetch(CONFIG.API_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: cleanText,
          agent: chosenAgent,
          systemPrompt: AGENTS[chosenAgent].sys,
          history: state.history.slice(-8),
          tts: CONFIG.TTS_ENABLED
        })
      });

      if (!res.ok) throw new Error('Sunucu yanıt vermedi');
      var data = await res.json();
      var replyText = data.reply || 'Yanıt alındı.';
      replyBox.textContent = replyText;
      state.history.push({ role: 'assistant', content: replyText });
      speakResponse(replyText, data.audioBase64);
    } catch (err) {
      // Eğer henüz Vercel'e yüklenmediyse (yerel testteyse) akıllı yerel yanıt üretir
      var fallback = generateSmartOfflineReply(cleanText, chosenAgent);
      replyBox.textContent = fallback;
      state.history.push({ role: 'assistant', content: fallback });
      speakResponse(fallback, null);
    } finally {
      state.busy = false;
      setPill('ÇEVRİMİÇİ', '');
    }
  }

  function generateSmartOfflineReply(q, ag) {
    if (ag === 'siber') return "Siber Güvenlik Çekirdeği devrede. İsteğiniz ('" + q + "') analiz edildi: Ağ katmanında güvenli iletişim ve yetkilendirme kontrolleri aktif. Detaylı sızma testi veya mimari sıkılaştırma adımlarını sıralamamı ister misiniz?";
    if (ag === 'yazilim') return "Yazılım Mimarisi Çekirdeği devrede. '" + q + "' için modüler ve ölçeklenebilir kod yapısını hazırlıyorum. Hangi dil veya teknoloji yığınıyla ilerlememizi tercih edersiniz?";
    if (ag === 'proje') return "Proje & Strateji Çekirdeği devrede. '" + q + "' konusunu 3 ana faza böldüm: 1) Gereksinim ve Mimari Analiz, 2) Prototip & Entegrasyon, 3) Canlıya Alma ve Otomasyon.";
    return "Karar Küresi sizi dinliyor. '" + q + "' konusunda tüm alt ajanlarımla birlikte hazırım. Devam edelim mi?";
  }

  /* =========================================================
     3. SESLENDİRME (ELEVENLABS BASE64 SES VEYA TARAYICI TTS)
     ========================================================= */
  var currentAudio = null;
  function speakResponse(text, audioBase64) {
    if (!CONFIG.TTS_ENABLED) {
      if (CONFIG.HANDS_FREE && state.listening) startMic();
      return;
    }

    var clean = text.replace(/```[\s\S]*?```/g, ' Kod bloğu ekranda hazır. ').replace(/[*#`_~]/g, '');
    setPill('KONUŞUYOR', 'speak');
    document.getElementById('audioStateBadge').textContent = 'SES FREKANSI: AKTİF ÇIKIŞ';

    // 1. Sunucudan (ElevenLabs veya Gemini TTS) gerçek ses geldiyse onu çal
    if (audioBase64) {
      try {
        if (currentAudio) currentAudio.pause();
        currentAudio = new Audio('data:audio/mp3;base64,' + audioBase64);
        state.speaking = true;
        var pulseInt = setInterval(function() { state.audioEnergy = 0.4 + Math.random() * 0.6; }, 80);
        currentAudio.onended = function() {
          clearInterval(pulseInt);
          state.speaking = false; state.audioEnergy = 0;
          setPill('ÇEVRİMİÇİ', '');
          document.getElementById('audioStateBadge').textContent = 'SES FREKANSI: HAZIR';
          if (CONFIG.HANDS_FREE && state.listening) startMic();
        };
        currentAudio.play();
        return;
      } catch (e) {}
    }

    // 2. Yedek olarak Tarayıcı Türkçe Ses Motoru
    speakBrowserInstant(clean, function() {
      setPill('ÇEVRİMİÇİ', '');
      document.getElementById('audioStateBadge').textContent = 'SES FREKANSI: HAZIR';
      if (CONFIG.HANDS_FREE && state.listening) startMic();
    });
  }

  /* =========================================================
     4. CANLI MİKROFON (WEB SPEECH API - ELLER SERBEST)
     ========================================================= */
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null;

  function startMic() {
    if (!SpeechRecognition) {
      document.getElementById('liveTranscript').textContent = 'Tarayıcınız sesli komutu desteklemiyor (Chrome/Edge önerilir).';
      return;
    }
    if (rec) { try { rec.abort(); } catch (e) {} }
    rec = new SpeechRecognition();
    rec.lang = 'tr-TR';
    rec.interimResults = true;
    rec.continuous = false;

    rec.onstart = function() {
      state.listening = true;
      document.getElementById('micBtn').classList.add('on');
      document.getElementById('micBtn').textContent = '⏹ DİNLENİYOR...';
      setPill('SİZİ DİNLİYOR', 'listen');
      document.getElementById('liveTranscript').textContent = 'Konuşabilirsiniz, sizi dinliyorum...';
    };

    rec.onresult = function(ev) {
      var transcript = '';
      var isFinal = false;
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        transcript += ev.results[i][0].transcript;
        if (ev.results[i].isFinal) isFinal = true;
      }
      state.audioEnergy = 0.5 + Math.random() * 0.5;
      document.getElementById('liveTranscript').textContent = '❝ ' + transcript + ' ❞';
      if (isFinal && transcript.trim()) {
        state.audioEnergy = 0;
        sendUserMessage(transcript.trim());
      }
    };

    rec.onerror = function() { stopMicUI(); };
    rec.onend = function() { if (!state.speaking && !state.busy && !CONFIG.HANDS_FREE) stopMicUI(); };
    try { rec.start(); } catch (e) {}
  }

  function stopMicUI() {
    state.listening = false;
    state.audioEnergy = 0;
    document.getElementById('micBtn').classList.remove('on');
    document.getElementById('micBtn').textContent = '🎙 CANLI SESLİ KONUŞ';
    setPill('ÇEVRİMİÇİ', '');
  }

  document.getElementById('micBtn').addEventListener('click', function() {
    if (state.listening) {
      if (rec) rec.abort();
      stopMicUI();
    } else {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      startMic();
    }
  });

  document.getElementById('handsFreeBtn').addEventListener('click', function() {
    CONFIG.HANDS_FREE = !CONFIG.HANDS_FREE;
    this.classList.toggle('on', CONFIG.HANDS_FREE);
    this.textContent = 'ELLER SERBEST: ' + (CONFIG.HANDS_FREE ? 'AÇIK' : 'KAPALI');
  });

  document.getElementById('ttsToggleBtn').addEventListener('click', function() {
    CONFIG.TTS_ENABLED = !CONFIG.TTS_ENABLED;
    this.classList.toggle('on', CONFIG.TTS_ENABLED);
    this.textContent = 'SESLİ YANIT: ' + (CONFIG.TTS_ENABLED ? 'AÇIK' : 'KAPALI');
    if (!CONFIG.TTS_ENABLED && 'speechSynthesis' in window) window.speechSynthesis.cancel();
  });

  function setPill(txt, cls) {
    document.getElementById('statusText').textContent = txt;
    document.getElementById('statusPill').className = 'pill ' + (cls || '');
  }

  document.getElementById('chatForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var inp = document.getElementById('inp');
    sendUserMessage(inp.value);
    inp.value = '';
  });
  document.getElementById('inp').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendUserMessage(this.value);
      this.value = '';
    }
  });
  document.getElementById('clearChatBtn').addEventListener('click', function() {
    document.getElementById('msgs').innerHTML = '';
    state.history = [];
  });

  /* =========================================================
     5. 3B SES REAKTİF KARAR KÜRESİ ANİMASYONU
     ========================================================= */
  var cv = document.getElementById('globe'), ctx = cv.getContext('2d');
  var W = 0, H = 0, yaw = 0, pitch = 0.3;
  function resize() {
    var r = cv.getBoundingClientRect();
    W = cv.width = r.width * (window.devicePixelRatio || 1);
    H = cv.height = r.height * (window.devicePixelRatio || 1);
    ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
    W = r.width; H = r.height;
  }
  window.addEventListener('resize', resize);
  resize();

  var NODES = [];
  for (var i = 0; i < 90; i++) {
    var lat = (Math.random() * 140 - 70) * Math.PI / 180;
    var lon = (Math.random() * 360) * Math.PI / 180;
    NODES.push([Math.cos(lat)*Math.sin(lon), Math.sin(lat), Math.cos(lat)*Math.cos(lon)]);
  }

  function drawGlobe(t) {
    ctx.clearRect(0, 0, W, H);
    var cx = W / 2, cy = H / 2;
    var energy = state.audioEnergy || (state.busy ? 0.35 : 0.05);
    var R = Math.min(W, H) * 0.34 * (1 + energy * 0.14 * Math.sin(t * 0.015));

    yaw += 0.006 + energy * 0.02;
    var cyaw = Math.cos(yaw), syaw = Math.sin(yaw);
    var cp = Math.cos(pitch), sp = Math.sin(pitch);

    var color = state.listening ? '0, 217, 245' : (state.speaking ? '0, 245, 160' : '180, 225, 215');

    // Çekirdek Aura
    var grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, R * 1.3);
    grad.addColorStop(0, 'rgba(' + color + ',' + (0.35 + energy * 0.4) + ')');
    grad.addColorStop(0.5, 'rgba(' + color + ', 0.08)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.3, 0, Math.PI * 2); ctx.fill();

    // Jiroskop Halkaları
    ctx.strokeStyle = 'rgba(' + color + ', 0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.08, 0, Math.PI * 2); ctx.stroke();

    // Küre Noktaları ve Sinaptik Bağlar
    var proj = [];
    for (var i = 0; i < NODES.length; i++) {
      var n = NODES[i];
      var x1 = n[0]*cyaw + n[2]*syaw, z1 = -n[0]*syaw + n[2]*cyaw;
      var y2 = n[1]*cp - z1*sp, z2 = n[1]*sp + z1*cp;
      var scale = 1 + z2 * 0.15;
      proj.push({ x: cx + x1 * R * scale, y: cy - y2 * R * scale, z: z2 });
    }

    ctx.strokeStyle = 'rgba(' + color + ', 0.16)';
    ctx.beginPath();
    for (var i = 0; i < proj.length; i++) {
      for (var j = i + 1; j < proj.length; j++) {
        var dx = proj[i].x - proj[j].x, dy = proj[i].y - proj[j].y;
        if (dx*dx + dy*dy < (R * 0.38) * (R * 0.38)) {
          ctx.moveTo(proj[i].x, proj[i].y);
          ctx.lineTo(proj[j].x, proj[j].y);
        }
      }
    }
    ctx.stroke();

    for (var i = 0; i < proj.length; i++) {
      var p = proj[i];
      var alpha = 0.25 + 0.75 * ((p.z + 1) / 2);
      ctx.fillStyle = 'rgba(' + color + ',' + alpha + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, (p.z > 0 ? 2.5 : 1.4) + energy * 2, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(drawGlobe);
  }
  requestAnimationFrame(drawGlobe);
})();
</script>
